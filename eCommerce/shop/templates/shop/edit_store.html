<!DOCTYPE html>
<html>
<head>
    <title>Edit Store</title>
</head>
<body>

    <h1>Edit Store</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="name">Store Name:</label>
        <input type="text" name="name" id="name"
               value="{{ store.name }}" required>

        <br><br>

        <label for="description">Description:</label>
        <br>
        <textarea name="description" id="description">{{ store.description }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'shop:store_list' %}">
        Back to Stores
    </a>

</body>
</html>
