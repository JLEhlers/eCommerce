Here is your **Register page** with the same Bootstrap theme as the rest of your eCommerce project. I kept your password confirmation and Buyer/Vendor role selection.

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'shop:login' %}">
            eCommerce
        </a>
    </div>
</nav>

<main class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="mb-4 text-center">
                        Register
                    </h1>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label
                                for="username"
                                class="form-label"
                            >
                                Username:
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="email"
                                class="form-label"
                            >
                                Email:
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="password"
                                class="form-label"
                            >
                                Password:
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="password_confirm"
                                class="form-label"
                            >
                                Confirm Password:
                            </label>

                            <input
                                type="password"
                                name="password_confirm"
                                id="password_confirm"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label
                                for="role"
                                class="form-label"
                            >
                                Register as:
                            </label>

                            <select
                                name="role"
                                id="role"
                                class="form-select"
                                required
                            >
                                <option value="buyer">
                                    Buyer
                                </option>

                                <option value="vendor">
                                    Vendor
                                </option>
                            </select>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Register
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0">
                            Already have an account?
                            <a href="{% url 'shop:login' %}">
                                Login
                            </a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
