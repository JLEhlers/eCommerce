{% block content %}

<h2>Your cart:</h2>

<table>
    <tr>
        <th>Product name</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>

    {% for product in cart %}
    <tr>
        <td>{{ product.product.name }}</td>
        <td>{{ product.quantity }}</td>
        <td>{{ product.product.price }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
