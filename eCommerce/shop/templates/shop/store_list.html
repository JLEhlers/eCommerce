<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stores</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a
            class="navbar-brand"
            href="{% url 'shop:welcome' %}"
        >
            eCommerce
        </a>

        <a
            href="{% url 'shop:logout' %}"
            class="btn btn-outline-light"
        >
            Logout
        </a>

    </div>
</nav>

<main class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Stores</h1>

        <a
            href="{% url 'shop:create_store' %}"
            class="btn btn-dark"
        >
            Create Store
        </a>

    </div>

    <div class="row">

        {% for store in stores %}

            <div class="col-md-6 col-lg-4 mb-4">

                <div class="card shadow-sm h-100">

                    <div class="card-body">

                        <h2 class="card-title h4">
                            {{ store.name }}
                        </h2>

                        <p class="card-text">
                            {{ store.description }}
                        </p>

                        <p>
                            <strong>Owner:</strong>
                            {{ store.owner.username }}
                        </p>

                        <div class="mt-3">

                            <a
                                href="{% url 'shop:edit_store' store.id %}"
                                class="btn btn-outline-dark btn-sm"
                            >
                                Edit
                            </a>

                            <a
                                href="{% url 'shop:delete_store' store.id %}"
                                class="btn btn-danger btn-sm"
                            >
                                Delete
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        {% empty %}

            <div class="col-12">

                <div class="alert alert-secondary">
                    No stores have been created yet.
                </div>

            </div>

        {% endfor %}

    </div>

    <div class="mt-4">

        <a
            href="{% url 'shop:product_list' %}"
            class="btn btn-outline-dark me-2"
        >
            View Products
        </a>

        <a
            href="{% url 'shop:welcome' %}"
            class="btn btn-outline-dark"
        >
            Back to Welcome
        </a>

    </div>

</main>

</body>
</html>
