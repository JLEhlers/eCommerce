<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Buyer Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navigation bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shop:welcome' %}">
                eCommerce
            </a>

            <a class="btn btn-outline-light" href="{% url 'shop:logout' %}">
                Logout
            </a>
        </div>
    </nav>

    <!-- Dashboard -->
    <main class="container py-5">

        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">Buyer Dashboard</h1>
            <p class="lead text-muted">
                Welcome, {{ user.username }}!
            </p>
        </div>

        <div class="row justify-content-center g-4">

            <!-- Browse products -->
            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center p-4">
                        <h3 class="card-title">Browse Products</h3>

                        <p class="card-text text-muted">
                            Browse products from our stores and find
                            something you like.
                        </p>

                        <a
                            href="{% url 'shop:product_list' %}"
                            class="btn btn-primary"
                        >
                            Browse Products
                        </a>
                    </div>
                </div>
            </div>

            <!-- Cart -->
            <div class="col-md-5">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center p-4">
                        <h3 class="card-title">Your Cart</h3>

                        <p class="card-text text-muted">
                            View the products you have added to your cart
                            and checkout.
                        </p>

                        <a
                            href="{% url 'shop:cart_page' %}"
                            class="btn btn-success"
                        >
                            View Cart
                        </a>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">eCommerce Store</p>
    </footer>

</body>
</html>
