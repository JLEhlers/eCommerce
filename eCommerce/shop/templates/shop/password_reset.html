<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
</head>
<body>

    <h1>Reset Password</h1>

    {% if token %}

        <form method="POST" action="{% url 'shop:reset_password' %}">
            {% csrf_token %}

            <label for="password">New Password:</label>
            <input
                type="password"
                name="password"
                id="password"
                required
            >

            <br><br>

            <label for="password_conf">Confirm Password:</label>
            <input
                type="password"
                name="password_conf"
                id="password_conf"
                required
            >

            <br><br>

            <button type="submit">Change Password</button>
        </form>

    {% else %}

        <p>This password reset link is invalid or has expired.</p>

    {% endif %}

    <br>

    <a href="{% url 'shop:login' %}">
        Back to Login
    </a>

</body>
</html>
