<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a
                class="navbar-brand"
                href="{% url 'shop:login' %}"
            >
                eCommerce
            </a>

        </div>
    </nav>

    <!-- Reset Password Form -->
    <main class="container mt-5 mb-5">

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h1 class="h2 mb-4 text-center">
                            Reset Password
                        </h1>

                        <!-- Error Message -->
                        {% if error %}
                            <div class="alert alert-danger">
                                {{ error }}
                            </div>
                        {% endif %}

                        <!-- Success Message -->
                        {% if success %}
                            <div class="alert alert-success">
                                {{ success }}

                                <div class="mt-2">
                                    <a href="{% url 'shop:login' %}">
                                        Log in here
                                    </a>
                                </div>
                            </div>
                        {% endif %}

                        {% if token %}

                            <form
                                method="POST"
                                action="{% url 'shop:password_reset' token=token %}"
                            >
                                {% csrf_token %}

                                <div class="mb-3">

                                    <label
                                        for="password"
                                        class="form-label"
                                    >
                                        New Password:
                                    </label>

                                    <input
                                        type="password"
                                        name="password"
                                        id="password"
                                        class="form-control"
                                        required
                                    >

                                </div>

                                <div class="mb-4">

                                    <label
                                        for="confirm_password"
                                        class="form-label"
                                    >
                                        Confirm Password:
                                    </label>

                                    <input
                                        type="password"
                                        name="confirm_password"
                                        id="confirm_password"
                                        class="form-control"
                                        required
                                    >

                                </div>

                                <button
                                    type="submit"
                                    class="btn btn-dark w-100"
                                >
                                    Change Password
                                </button>

                            </form>

                        {% endif %}

                        <div class="text-center mt-4">

                            <a
                                href="{% url 'shop:login' %}"
                                class="btn btn-outline-dark"
                            >
                                Back to Login
                            </a>

                        </div>

                    </div>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
