<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-body">

            <h1 class="mb-4">Add Product</h1>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Product Name:
                    </label>
                    <input
                        type="text"
                        name="name"
                        id="name"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description:
                    </label>
                    <textarea
                        name="description"
                        id="description"
                        class="form-control"
                        rows="4"
                    ></textarea>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">
                        Price:
                    </label>
                    <input
                        type="number"
                        name="price"
                        id="price"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="stock" class="form-label">
                        Stock:
                    </label>
                    <input
                        type="number"
                        name="stock"
                        id="stock"
                        class="form-control"
                        min="0"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="store" class="form-label">
                        Store:
                    </label>

                    <select
                        name="store"
                        id="store"
                        class="form-select"
                        required
                    >
                        {% for store in stores %}
                            <option value="{{ store.id }}">
                                {{ store.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-success">
                    Add Product
                </button>

                <a
                    href="{% url 'shop:product_list' %}"
