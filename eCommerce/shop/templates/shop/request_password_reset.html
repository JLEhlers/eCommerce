<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

    <h1>Forgot Password?</h1>

    <p>Enter your username to receive a password reset link.</p>

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username:</label>

        <input
            type="text"
            name="username"
            id="username"
            required
        >

        <br><br>

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <br>

    <a href="{% url 'shop:login' %}">
        Back to Login
    </a>

</body>
</html>
