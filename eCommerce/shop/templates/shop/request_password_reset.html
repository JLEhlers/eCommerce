<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'shop:login' %}">
            eCommerce
        </a>
    </div>
</nav>

<main class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="mb-3 text-center">
                        Forgot Password?
                    </h1>

                    <p class="text-muted text-center mb-4">
                        Enter your username to receive a password
                        reset link.
                    </p>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label
                                for="username"
                                class="form-label"
                            >
                                Username:
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Send Reset Link
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <a
                            href="{% url 'shop:login' %}"
                            class="btn btn-outline-dark"
                        >
                            Back to Login
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
